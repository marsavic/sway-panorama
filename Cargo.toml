[package]
name = "sway-panorama"
version = "0.1.0"
edition = "2024"

[dependencies]
cosmic-text = "0.19"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
resvg = { version = "0.48", default-features = false }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
toml = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
xkbcommon = "0.8"
