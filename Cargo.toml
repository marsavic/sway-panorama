[package]
name = "sway-panorama"
version = "0.2.0"
edition = "2024"
description = "A live overview of Sway workspaces in one Wayland window"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marsavic/sway-panorama"
keywords = ["sway", "wayland", "workspace", "overview"]
categories = ["gui"]


[dependencies]
cosmic-text = "0.19"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
resvg = { version = "0.48", default-features = false }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
ron = "0.12"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
xkbcommon = "0.8"
